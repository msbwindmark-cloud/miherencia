{% extends "base.html" %}
{% block title %}Nuevo Item Inventario{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <h2 style="color:var(--gold);"><i class="bi bi-box-seam"></i> Nuevo Item de Inventario</h2>
        <div class="card glass-card border-0">
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">Nombre</label><input name="nombre" class="form-control" required></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Categoria</label><input name="categoria" class="form-control" required placeholder="Ej: Muebles, Herramientas, Pintura"></div>
                    </div>
                    <div class="mb-3"><label class="form-label">Descripcion</label><textarea name="descripcion" class="form-control" rows="2"></textarea></div>
                    <div class="row">
                        <div class="col-md-3 mb-3"><label class="form-label">Cantidad</label><input name="cantidad" type="number" class="form-control" value="1"></div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Estado</label>
                            <select name="estado" class="form-select"><option value="bueno">Bueno</option><option value="regular">Regular</option><option value="malo">Malo</option><option value="deteriorado">Deteriorado</option></select>
                        </div>
                        <div class="col-md-3 mb-3"><label class="form-label">Valor (EUR)</label><input name="valor_estimado" type="number" step="0.01" class="form-control"></div>
                        <div class="col-md-3 mb-3"><label class="form-label">Ubicacion</label><input name="ubicacion" class="form-control"></div>
                    </div>
                    <div class="mb-3"><label class="form-label">Foto</label><input name="imagen" type="file" class="form-control" accept="image/*"></div>
                    <button type="submit" class="btn btn-accent w-100"><i class="bi bi-check-circle"></i> Guardar Item</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
