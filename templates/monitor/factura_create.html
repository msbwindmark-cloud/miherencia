{% extends "base.html" %}
{% block title %}Nueva Factura - {{ edificio.nombre }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <h2 style="color:var(--gold);"><i class="bi bi-receipt"></i> Nueva Factura</h2>
        <p style="color:var(--text-muted);">Edificio: <strong>{{ edificio.nombre }}</strong></p>
        <div class="card glass-card border-0">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6 mb-3"><label class="form-label">Numero Factura</label><input name="numero" class="form-control" value="FAC-{{ today|date:'Ymd' }}" required></div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Tipo</label>
                            <select name="tipo" class="form-select"><option value="emitted">Emitida</option><option value="received">Recibida</option></select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Estado</label>
                            <select name="estado" class="form-select"><option value="borrador">Borrador</option><option value="enviada">Enviada</option><option value="pagada">Pagada</option></select>
                        </div>
                        <div class="col-md-6 mb-3"><label class="form-label">Cliente / Proveedor</label><input name="cliente_proveedor" class="form-control" required placeholder="Nombre completo"></div>
                        <div class="col-md-3 mb-3"><label class="form-label">NIF</label><input name="cliente_nif" class="form-control" placeholder="B12345678"></div>
                        <div class="col-md-3 mb-3"><label class="form-label">Email</label><input name="cliente_email" type="email" class="form-control"></div>
                        <div class="col-12 mb-3"><label class="form-label">Direccion</label><input name="cliente_direccion" class="form-control" placeholder="Direccion completa"></div>
                        <div class="col-12 mb-3"><label class="form-label">Concepto</label><input name="concepto" class="form-control" required placeholder="Descripcion del servicio/producto"></div>
                        <div class="col-md-4 mb-3"><label class="form-label">Base Imponible (EUR)</label><input name="base_imponible" type="number" step="0.01" class="form-control" required id="baseImp" onkeyup="calcIVA()"></div>
                        <div class="col-md-4 mb-3"><label class="form-label">IVA (%)</label><input name="porcentaje_iva" type="number" step="0.01" class="form-control" value="21" id="ivaPct" onkeyup="calcIVA()"></div>
                        <div class="col-md-4 mb-3"><label class="form-label">Total</label><input type="text" class="form-control" id="totalCalc" readonly style="font-weight:700;color:var(--gold);"></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Fecha Emision</label><input name="fecha_emision" type="date" class="form-control" value="{{ today }}"></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Fecha Vencimiento</label><input name="fecha_vencimiento" type="date" class="form-control"></div>
                        <div class="col-12 mb-3"><label class="form-label">Notas</label><textarea name="notas" class="form-control" rows="2"></textarea></div>
                    </div>
                    <button type="submit" class="btn btn-accent w-100 mt-3"><i class="bi bi-check-circle"></i> Crear Factura</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
function calcIVA() {
    const base = parseFloat(document.getElementById('baseImp').value) || 0;
    const iva = parseFloat(document.getElementById('ivaPct').value) || 0;
    const total = base + (base * iva / 100);
    document.getElementById('totalCalc').value = total.toFixed(2) + ' EUR';
}
</script>
{% endblock %}
