{% extends "base.html" %}
{% block title %}Nuevo Registro Bitacora{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <h2 style="color:var(--gold);"><i class="bi bi-journal-plus"></i> Nuevo Registro en Bitacora</h2>
        <div class="card glass-card border-0">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3"><label class="form-label">Titulo</label><input name="titulo" class="form-control" required placeholder="Ej: Inicio de restauracion fachada"></div>
                    <div class="mb-3"><label class="form-label">Descripcion</label><textarea name="descripcion" class="form-control" rows="4" required placeholder="Describe detalladamente el avance, problema o solucion..."></textarea></div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Tipo</label>
                            <select name="tipo" class="form-select"><option value="inicio">Inicio de Obra</option><option value="avance" selected>Avance</option><option value="problema">Problema Detectado</option><option value="solucion">Solucion Aplicada</option><option value="material">Material Recibido</option><option value="inspeccion">Inspeccion</option><option value="fin">Fin de Obra</option></select>
                        </div>
                        <div class="col-md-6 mb-3"><label class="form-label">Coste (EUR)</label><input name="coste" type="number" step="0.01" class="form-control" value="0"></div>
                    </div>
                    <button type="submit" class="btn btn-accent w-100"><i class="bi bi-check-circle"></i> Guardar Registro</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
