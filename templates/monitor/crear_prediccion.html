{% extends "base.html" %}
{% block title %}Crear Prediccion - {{ edificio.nombre }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <h2 style="color:var(--gold);"><i class="bi bi-cpu"></i> Crear Prediccion de Mantenimiento</h2>
        <p style="color:var(--text-muted);">Edificio: <strong>{{ edificio.nombre }}</strong></p>
        <div class="card glass-card border-0">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Titulo del problema</label>
                        <input type="text" name="titulo" class="form-control" required placeholder="Ej: Degradacion del mortero en fachada norte">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripcion</label>
                        <textarea name="descripcion" class="form-control" rows="3" required placeholder="Describe el problema detectado..."></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Prioridad</label>
                            <select name="prioridad" class="form-select">
                                <option value="baja">Baja</option>
                                <option value="media" selected>Media</option>
                                <option value="alta">Alta</option>
                                <option value="urgente">Urgente</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Probabilidad de fallo (%)</label>
                            <input type="number" name="probabilidad_fallo" class="form-control" value="50" min="0" max="100">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Dias hasta fallo</label>
                            <input type="number" name="dias_estimados" class="form-control" value="30">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Costo estimado ($)</label>
                            <input type="number" name="costo_estimado" class="form-control" value="0" step="0.01">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Accion recomendada</label>
                        <textarea name="accion_recomendada" class="form-control" rows="2" required placeholder="Que se debe hacer para prevenir el fallo..."></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-accent"><i class="bi bi-save"></i> Crear Prediccion</button>
                        <a href="{% url 'monitor:mantenimiento_predictivo' %}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
