{% extends "base.html" %}
{% block title %}Nuevo Ingreso - {{ edificio.nombre }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <h2 style="color:#28a745;"><i class="bi bi-plus-circle"></i> Nuevo Ingreso</h2>
        <p style="color:var(--text-muted);">Edificio: <strong>{{ edificio.nombre }}</strong></p>
        <div class="card glass-card border-0">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-8 mb-3"><label class="form-label">Concepto</label><input name="concepto" class="form-control" required placeholder="Ej: Alquiler espacio cultural"></div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Categoria</label>
                            <select name="categoria" class="form-select"><option value="">Sin categoria</option>{% for c in categorias %}<option value="{{ c.pk }}">{{ c.nombre }}</option>{% endfor %}</select>
                        </div>
                        <div class="col-md-4 mb-3"><label class="form-label">Monto (EUR)</label><input name="monto" type="number" step="0.01" class="form-control" required></div>
                        <div class="col-md-4 mb-3"><label class="form-label">Fecha</label><input name="fecha" type="date" class="form-control" value="{{ today }}"></div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Estado</label>
                            <select name="estado" class="form-select"><option value="pendiente">Pendiente</option><option value="cobrado">Cobrado</option><option value="cancelado">Cancelado</option></select>
                        </div>
                        <div class="col-md-4 mb-3"><label class="form-label">Cliente</label><input name="cliente_nombre" class="form-control" placeholder="Nombre del cliente"></div>
                        <div class="col-md-4 mb-3"><label class="form-label">Email cliente</label><input name="cliente_email" type="email" class="form-control"></div>
                        <div class="col-md-4 mb-3"><label class="form-label">NIF cliente</label><input name="cliente_nif" class="form-control"></div>
                        <div class="col-12 mb-3"><label class="form-label">Descripcion</label><textarea name="descripcion" class="form-control" rows="2"></textarea></div>
                        <div class="col-12 mb-3"><div class="form-check"><input class="form-check-input" type="checkbox" name="recurrente" id="rec"><label class="form-check-label" for="rec">Ingreso recurrente (mensual)</label></div></div>
                        <div class="col-12 mb-3"><label class="form-label">Notas</label><textarea name="notas" class="form-control" rows="2"></textarea></div>
                    </div>
                    <button type="submit" class="btn btn-success w-100 mt-3"><i class="bi bi-check-circle"></i> Guardar Ingreso</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
