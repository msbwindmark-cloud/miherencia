{% extends 'base.html' %}
{% block title %}Eliminar Sensor - SmartHeritage{% endblock %}
{% block content %}
<div class="hero-section">
    <div class="container">
        <h1><i class="bi bi-trash"></i> Eliminar Sensor</h1>
    </div>
</div>
<div class="container fade-in">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card-custom">
                <div class="card-body p-4 text-center">
                    <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width:80px;height:80px;background:#fee;color:#dc3545;font-size:2rem;">
                        <i class="bi bi-exclamation-triangle"></i>
                    </div>
                    <h4 class="fw-bold">¿Eliminar "{{ sensor.nombre }}"?</h4>
                    <p class="text-muted">Se eliminarán todas las lecturas y alertas asociadas a este sensor.</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3 mt-4">
                            <a href="{% url 'monitor:sensor_detail' pk=sensor.pk %}" class="btn btn-outline-secondary btn-lg"><i class="bi bi-arrow-left me-2"></i>Cancelar</a>
                            <button type="submit" class="btn btn-lg" style="background:#dc3545;color:white"><i class="bi bi-trash me-2"></i>Eliminar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
