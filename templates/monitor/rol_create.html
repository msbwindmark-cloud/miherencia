{% extends "base.html" %}
{% block title %}Nuevo Rol{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <h2 style="color:var(--gold);"><i class="bi bi-shield-plus"></i> Nuevo Rol</h2>
        <div class="card glass-card border-0">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3"><label class="form-label">Nombre del Rol</label><input name="nombre" class="form-control" required placeholder="Ej: Arquitecto"></div>
                    <div class="mb-3"><label class="form-label">Descripcion</label><textarea name="descripcion" class="form-control" rows="2"></textarea></div>
                    <h6 style="color:var(--gold);">Permisos:</h6>
                    <div class="row">
                        <div class="col-md-4 mb-2"><div class="form-check"><input class="form-check-input" type="checkbox" name="puede_ver_edificios" checked><label class="form-check-label">Ver Edificios</label></div></div>
                        <div class="col-md-4 mb-2"><div class="form-check"><input class="form-check-input" type="checkbox" name="puede_editar_edificios"><label class="form-check-label">Editar Edificios</label></div></div>
                        <div class="col-md-4 mb-2"><div class="form-check"><input class="form-check-input" type="checkbox" name="puede_ver_alertas" checked><label class="form-check-label">Ver Alertas</label></div></div>
                        <div class="col-md-4 mb-2"><div class="form-check"><input class="form-check-input" type="checkbox" name="puede_resolver_alertas"><label class="form-check-label">Resolver Alertas</label></div></div>
                        <div class="col-md-4 mb-2"><div class="form-check"><input class="form-check-input" type="checkbox" name="puede_ver_finanzas"><label class="form-check-label">Ver Finanzas</label></div></div>
                        <div class="col-md-4 mb-2"><div class="form-check"><input class="form-check-input" type="checkbox" name="puede_editar_finanzas"><label class="form-check-label">Editar Finanzas</label></div></div>
                        <div class="col-md-4 mb-2"><div class="form-check"><input class="form-check-input" type="checkbox" name="puede_aprobar"><label class="form-check-label">Aprobar</label></div></div>
                        <div class="col-md-4 mb-2"><div class="form-check"><input class="form-check-input" type="checkbox" name="puede_exportar" checked><label class="form-check-label">Exportar</label></div></div>
                        <div class="col-md-4 mb-2"><div class="form-check"><input class="form-check-input" type="checkbox" name="es_admin"><label class="form-check-label">Es Admin</label></div></div>
                    </div>
                    <button type="submit" class="btn btn-accent w-100 mt-3"><i class="bi bi-check-circle"></i> Crear Rol</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
