{% extends "base.html" %}
{% block title %}Nuevo Presupuesto - {{ edificio.nombre }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <h2 style="color:var(--gold);"><i class="bi bi-wallet2"></i> Nuevo Presupuesto</h2>
        <div class="card glass-card border-0">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-8 mb-3"><label class="form-label">Nombre</label><input name="nombre" class="form-control" required placeholder="Ej: Mantenimiento fachada Q1"></div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Categoria</label>
                            <select name="categoria" class="form-select"><option value="">General</option>{% for c in categorias %}<option value="{{ c.pk }}">{{ c.nombre }}</option>{% endfor %}</select>
                        </div>
                        <div class="col-md-4 mb-3"><label class="form-label">Monto Asignado (EUR)</label><input name="monto_asignado" type="number" step="0.01" class="form-control" required></div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Periodo</label>
                            <select name="periodo" class="form-select"><option value="mensual">Mensual</option><option value="trimestral">Trimestral</option><option value="anual">Anual</option></select>
                        </div>
                        <div class="col-md-4 mb-3"><label class="form-label">Alertar al %</label><input name="alerta_porcentaje" type="number" class="form-control" value="80"></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Fecha Inicio</label><input name="fecha_inicio" type="date" class="form-control" required></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Fecha Fin</label><input name="fecha_fin" type="date" class="form-control" required></div>
                    </div>
                    <button type="submit" class="btn btn-accent w-100 mt-3"><i class="bi bi-check-circle"></i> Crear Presupuesto</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
