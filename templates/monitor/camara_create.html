{% extends 'base.html' %}
{% block title %}Crear Camara - SmartHeritage{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="mb-1"><i class="bi bi-camera-video" style="color:var(--accent);"></i> Agregar Camara</h2>
        <p class="text-muted mb-0">{{ edificio.nombre }}</p>
    </div>
    <a href="{% url 'monitor:patrimonio_vivo' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
</div>

<div class="row g-4">
    <div class="col-lg-6">
        <div class="glass-card p-4">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre de la Camara</label>
                    <input type="text" name="nombre" class="form-control" placeholder="Ej: Camara Entrada Principal" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Ubicacion</label>
                    <input type="text" name="ubicacion" class="form-control" placeholder="Ej: Fachada norte, entrada principal">
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="detectar_vandalismo" checked>
                    <label class="form-check-label">Deteccion de vandalismo</label>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" name="contar_visitantes" checked>
                    <label class="form-check-label">Conteo de visitantes</label>
                </div>
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus"></i> Crear Camara</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
